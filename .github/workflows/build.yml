name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15   # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --build-system native

      - name: Build Upnext.app
        run: scripts/build-app.sh --dmg

      - name: Check the widget is bundled and sandboxed
        run: |
          APPEX=build/Upnext.app/Contents/PlugIns/UpnextWidget.appex
          test -x "$APPEX/Contents/MacOS/UpnextWidget"
          # Built by Xcode as a real extension, not a wrapped SwiftPM binary.
          plutil -extract DTPlatformName raw "$APPEX/Contents/Info.plist"
          codesign -d --entitlements - "$APPEX" 2>&1 | grep -q app-sandbox
          plutil -lint "$APPEX/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: Upnext
          path: build/Upnext.dmg
